[package]
name = "ainda-vivo-launcher"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[target.'cfg(windows)'.dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["loaded", "std"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
