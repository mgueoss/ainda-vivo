[package]
name = "ainda-vivo"
version = "0.0.12-dev.7"
edition = "2024"
rust-version = "1.89"
publish = false
description = "AINDA VIVO — protótipo Windows em primeira pessoa"

[workspace]
members = ["crates/ainda_vivo_core", "crates/ainda_vivo_launcher"]
resolver = "3"

[features]
dev-lab = []

[dependencies]
ainda_vivo_core = { path = "crates/ainda_vivo_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Enable skeletal clips in the loader as well as in the engine's animation plugin.
bevy_gltf = { version = "=0.18.1", default-features = false, features = ["bevy_animation"] }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
bevy = { version = "=0.18.1", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
    "bevy_window", "bevy_winit", "keyboard", "mouse", "bevy_color",
    "bevy_camera", "bevy_light", "bevy_mesh", "bevy_image", "bevy_shader",
    "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_text",
    "bevy_ui", "bevy_ui_render", "default_font", "tonemapping_luts", "zstd_rust",
    "bevy_audio", "bevy_gltf", "bevy_animation", "png", "reflect_auto_register"
] }

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"

[profile.test]
opt-level = 1
debug = 0

[profile.launcher]
inherits = "release"
opt-level = "s"
lto = false
strip = "symbols"

[[bin]]
name = "ainda-vivo"
path = "src/main.rs"
test = true
bench = false
